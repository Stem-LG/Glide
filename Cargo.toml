[package]
name = "glide"
version = "0.1.7"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A native Linux touchpad, from any touchscreen"
repository = "https://github.com/Stem-LG/Glide"
readme = "README.md"

[dependencies]
anyhow = "1"
ksni = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
evdev = "0.13"
qrcode = { version = "0.14", default-features = false }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[profile.dev]
debug = 0
[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
quircs = "0.10"
